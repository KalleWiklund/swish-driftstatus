<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Swish driftstatus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --surface:#f5f5f6;
    --ink:#141414;
    --muted:#67676f;
    --border:#e1e1e4;
    --red:#e43424;      /* Ny Teknik-röd */
    --red-dark:#a11916;
    --navy:#0c446c;      /* Ny Teknik-blå */
    --amber:#b26a00;
    --green:#2f7d32;
    --cond:"Barlow Condensed","Oswald","Arial Narrow",system-ui,sans-serif;
    --sans:"Roboto",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans)}

  /* Masthead i Ny Teknik-anda: vit, tvåfärgad ordbild, röd linjal */
  .masthead{background:var(--bg);border-bottom:2px solid var(--red)}
  .masthead-inner{max-width:900px;margin:0 auto;padding:18px 20px 14px}
  .wordmark{font:700 34px/1 var(--cond);letter-spacing:.005em;text-transform:none}
  .wordmark .a{color:var(--red)}
  .wordmark .b{color:var(--navy)}
  .kicker{display:block;font:600 12px/1 var(--cond);letter-spacing:.16em;
    text-transform:uppercase;color:var(--red);margin-bottom:6px}

  .wrap{max-width:900px;margin:0 auto;padding:20px 20px 72px}
  .source{margin:0 0 18px;color:var(--muted);font-size:13px}
  .source a{color:var(--red);text-decoration:none}
  .source a:hover{text-decoration:underline}

  /* Kontrollpanel */
  .bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;
    margin-bottom:16px;padding:14px;background:var(--surface);border:1px solid var(--border)}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font:600 11px/1 var(--cond);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
  select{padding:7px 9px;border:1px solid var(--border);border-radius:0;background:var(--bg);
    color:var(--ink);font:inherit;font-size:14px}
  select:focus-visible{outline:2px solid var(--navy);outline-offset:1px}
  .seg{display:flex;border:1px solid var(--border)}
  .seg button{padding:7px 13px;border:0;background:var(--bg);color:var(--ink);cursor:pointer;
    font:500 14px/1.2 var(--sans)}
  .seg button+button{border-left:1px solid var(--border)}
  .seg button[aria-pressed="true"]{background:var(--red);color:#fff}
  .spacer{flex:1}
  button.refresh{padding:7px 13px;border:1px solid var(--navy);border-radius:0;
    background:var(--bg);color:var(--navy);cursor:pointer;font:500 14px/1.2 var(--sans)}
  button.refresh:hover{background:var(--navy);color:#fff}

  /* Räknare */
  .stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
  .chip{font-size:12px;padding:4px 10px;background:var(--surface);border:1px solid var(--border)}
  .chip b{font-weight:700}

  /* Pågående-banner */
  .ongoing{margin-bottom:20px;padding:12px 14px;background:#fdecea;
    border:1px solid var(--red);border-left-width:4px;font-size:13px}
  .ongoing b{color:var(--red-dark);text-transform:uppercase;font:700 12px/1 var(--cond);letter-spacing:.08em}

  /* Grupprubriker vid sortering */
  .group{margin:26px 0 10px;padding-bottom:5px;border-bottom:2px solid var(--red);
    font:600 15px/1 var(--cond);text-transform:uppercase;letter-spacing:.08em;color:var(--navy)}
  .group:first-child{margin-top:4px}

  /* Incidentkort – redaktionell "flagga" till vänster */
  .inc{background:var(--bg);border:1px solid var(--border);border-left:4px solid var(--muted);
    padding:14px 16px;margin-bottom:10px}
  .inc-critical{border-left-color:var(--red-dark)}
  .inc-major{border-left-color:var(--red)}
  .inc-minor{border-left-color:var(--amber)}
  .inc-none{border-left-color:var(--navy)}
  .inc-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
  .sev{font:700 11px/1 var(--cond);text-transform:uppercase;letter-spacing:.06em;
    padding:4px 8px;color:#fff;white-space:nowrap}
  .sev.critical{background:var(--red-dark)}
  .sev.major{background:var(--red)}
  .sev.minor{background:var(--amber)}
  .sev.none{background:var(--navy)}
  .inc h3{margin:0;font:600 19px/1.2 var(--cond);flex:1;min-width:180px;color:var(--ink)}
  .state{font-size:12px;color:var(--muted);white-space:nowrap;text-transform:uppercase;
    font-weight:500;letter-spacing:.04em}
  .state.live{color:var(--red);font-weight:700}
  .banks{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .bank{font-size:11px;padding:2px 8px;border:1px solid var(--border);background:var(--surface);
    color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .meta{margin-top:9px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px}
  .body{margin-top:9px;font-size:13.5px;color:var(--ink);white-space:pre-wrap}
  .empty{padding:44px 12px;text-align:center;color:var(--muted)}
  .err{padding:14px;border:1px solid var(--red-dark);border-left-width:4px;color:var(--red-dark);
    background:#fdecea}

  @media (max-width:520px){
    .wordmark{font-size:28px}
    .bar{gap:10px 12px}
    .spacer{display:none}
  }
</style>
</head>
<body>
<div class="masthead">
  <div class="masthead-inner">
    <span class="kicker">Driftbevakning</span>
    <div class="wordmark"><span class="a">Swish</span><span class="b">&nbsp;driftstatus</span></div>
  </div>
</div>

<div class="wrap">
  <p class="source">Källa: <a href="https://status.swish.nu" target="_blank" rel="noopener">status.swish.nu</a>
     · <span id="updated">hämtar…</span></p>

  <div id="ongoing"></div>

  <div class="bar">
    <div class="field">
      <label>Urval</label>
      <div class="seg" id="view">
        <button data-view="10" aria-pressed="true">Senaste 10 dagarna</button>
        <button data-view="50" aria-pressed="false">50 senaste</button>
      </div>
    </div>
    <div class="field">
      <label for="sort">Sortera</label>
      <select id="sort">
        <option value="date">Senast inträffad</option>
        <option value="severity">Allvarlighetsgrad</option>
        <option value="bank">Drabbad bank</option>
      </select>
    </div>
    <div class="field">
      <label for="bank">Bank</label>
      <select id="bank"><option value="">Alla</option></select>
    </div>
    <div class="spacer"></div>
    <button class="refresh" id="refresh">Uppdatera</button>
  </div>

  <div class="stats" id="stats"></div>
  <div id="list"></div>
</div>

<script>
const API = "https://status.swish.nu/api/v2/incidents.json";
const SEV_RANK = {critical:3, major:2, minor:1, none:0};
const SEV_LABEL = {critical:"Kritisk", major:"Större", minor:"Mindre", none:"Ingen"};
const STATE_LABEL = {
  investigating:"Utreds", identified:"Identifierad", monitoring:"Övervakas",
  resolved:"Löst", postmortem:"Efteranalys"
};
const fmt = new Intl.DateTimeFormat("sv-SE",
  {dateStyle:"medium", timeStyle:"short", timeZone:"Europe/Stockholm"});

let raw = [];   // normaliserade incidenter (alltid 50 st från API:t)
const state = {view:"10", sort:"date", bank:""};

function parseBanks(inc){
  let s = inc.name.replace(/^\s*(disturbance|disruption|issues?|problem|delays?)\s+(at|with|for|hos|vid|med)\s+/i, "");
  if (s === inc.name) s = "";
  let banks = s ? s.split(/\s*(?:,|&|\/|\band\b|\boch\b)\s*/i).map(x=>x.trim()).filter(Boolean) : [];
  if (!banks.length){
    banks = (inc.components||[]).map(c=>c.name).filter(n=>!/^(private|business|commerce)$/i.test(n));
  }
  if (!banks.length) banks = ["Okänd / övergripande"];
  return [...new Set(banks)];
}

function normalize(list){
  return list.map(inc=>{
    const start = inc.started_at || inc.created_at;
    const end = inc.resolved_at || null;
    const ups = (inc.incident_updates||[]).slice().sort((a,b)=>
      new Date(b.created_at)-new Date(a.created_at));
    return {
      id: inc.id,
      name: inc.name,
      impact: inc.impact in SEV_RANK ? inc.impact : "none",
      status: inc.status,
      resolved: inc.status === "resolved" || inc.status === "postmortem",
      start: new Date(start),
      end: end ? new Date(end) : null,
      banks: parseBanks(inc),
      lastUpdate: ups[0] ? ups[0].body.trim() : "",
      link: inc.shortlink
    };
  });
}

function durationText(i){
  const to = i.end || new Date();
  let mins = Math.round((to - i.start)/60000);
  if (mins < 1) mins = 1;
  const h = Math.floor(mins/60), m = mins%60;
  const s = h ? `${h} h ${m} min` : `${m} min`;
  return i.end ? s : s + " (pågår)";
}

function currentSet(){
  let set = raw;
  if (state.view === "10"){
    const cutoff = Date.now() - 10*24*3600*1000;
    set = set.filter(i => i.start.getTime() >= cutoff);
  }
  if (state.bank){
    set = set.filter(i => i.banks.includes(state.bank));
  }
  return set;
}

function sortSet(set){
  const s = set.slice();
  if (state.sort === "date"){
    s.sort((a,b)=> b.start - a.start);
  } else if (state.sort === "severity"){
    s.sort((a,b)=> SEV_RANK[b.impact]-SEV_RANK[a.impact] || b.start-a.start);
  } else {
    s.sort((a,b)=> a.banks[0].localeCompare(b.banks[0], "sv") || b.start-a.start);
  }
  return s;
}

function groupKey(i){
  if (state.sort === "severity") return SEV_LABEL[i.impact];
  if (state.sort === "bank") return i.banks[0];
  return null;
}

function render(){
  const list = document.getElementById("list");
  const set = sortSet(currentSet());

  // statistik
  const counts = {critical:0, major:0, minor:0, none:0};
  set.forEach(i=>counts[i.impact]++);
  document.getElementById("stats").innerHTML =
    `<span class="chip"><b>${set.length}</b> incidenter</span>` +
    ["critical","major","minor","none"].filter(k=>counts[k]).map(k=>
      `<span class="chip"><b>${counts[k]}</b> ${SEV_LABEL[k].toLowerCase()}</span>`).join("");

  if (!set.length){
    list.innerHTML = `<div class="empty">Inga incidenter i det här urvalet.</div>`;
    return;
  }

  let html = "", lastGroup = null;
  for (const i of set){
    const g = groupKey(i);
    if (g !== null && g !== lastGroup){
      html += `<div class="group">${g}</div>`;
      lastGroup = g;
    }
    html += `
      <article class="inc inc-${i.impact}">
        <div class="inc-top">
          <span class="sev ${i.impact}">${SEV_LABEL[i.impact]}</span>
          <h3>${esc(i.name)}</h3>
          <span class="state ${i.resolved ? "" : "live"}">${STATE_LABEL[i.status]||i.status}</span>
        </div>
        <div class="banks">${i.banks.map(b=>`<span class="bank">${esc(b)}</span>`).join("")}</div>
        <div class="meta">
          <span>Start: ${fmt.format(i.start)}</span>
          <span>${i.end ? "Slut: "+fmt.format(i.end) : "Ej avslutad"}</span>
          <span>Varaktighet: ${durationText(i)}</span>
        </div>
        ${i.lastUpdate ? `<div class="body">${esc(i.lastUpdate)}</div>` : ""}
      </article>`;
  }
  list.innerHTML = html;
}

function renderOngoing(){
  const live = raw.filter(i=>!i.resolved);
  const el = document.getElementById("ongoing");
  el.innerHTML = live.length
    ? `<div class="ongoing"><b>Pågående just nu:</b> ${live.map(i=>esc(i.name)).join(" · ")}</div>`
    : "";
}

function fillBankFilter(){
  const banks = [...new Set(raw.flatMap(i=>i.banks))].sort((a,b)=>a.localeCompare(b,"sv"));
  const sel = document.getElementById("bank");
  sel.innerHTML = `<option value="">Alla</option>` +
    banks.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join("");
  sel.value = state.bank;
}

function esc(s){return String(s).replace(/[&<>"]/g, c=>(
  {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}

async function load(){
  const upd = document.getElementById("updated");
  upd.textContent = "hämtar…";
  try{
    const r = await fetch(API, {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP "+r.status);
    const data = await r.json();
    raw = normalize(data.incidents || []);
    upd.textContent = "uppdaterad " + fmt.format(new Date());
    fillBankFilter();
    renderOngoing();
    render();
  }catch(e){
    document.getElementById("list").innerHTML =
      `<div class="err">Kunde inte hämta data: ${esc(e.message)}. Försök igen.</div>`;
    upd.textContent = "fel vid hämtning";
  }
}

document.getElementById("view").addEventListener("click", e=>{
  const b = e.target.closest("button[data-view]"); if (!b) return;
  state.view = b.dataset.view;
  [...e.currentTarget.children].forEach(x=>
    x.setAttribute("aria-pressed", x===b));
  render();
});
document.getElementById("sort").addEventListener("change", e=>{
  state.sort = e.target.value; render();
});
document.getElementById("bank").addEventListener("change", e=>{
  state.bank = e.target.value; render();
});
document.getElementById("refresh").addEventListener("click", load);

load();
</script>
</body>
</html>
